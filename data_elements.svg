    <rect x="246" y="596" width="64" height="20" rx="10" fill="#E0F2FE"/><text x="278" y="610" fill="#0369A1">decimal</text>
    <rect x="246" y="642" width="64" height="20" rx="10" fill="#E0F2FE"/><text x="278" y="656" fill="#0369A1">string</text>
  </g>
  <g stroke="#EEF1F4"><line x1="56" y1="257" x2="484" y2="257"/><line x1="56" y1="303" x2="484" y2="303"/><line x1="56" y1="349" x2="484" y2="349"/><line x1="56" y1="395" x2="484" y2="395"/><line x1="56" y1="441" x2="484" y2="441"/><line x1="56" y1="487" x2="484" y2="487"/><line x1="56" y1="533" x2="484" y2="533"/><line x1="56" y1="579" x2="484" y2="579"/><line x1="56" y1="625" x2="484" y2="625"/></g>
  <text x="62" y="704" font-size="12" fill="#5A6872">member_id is tokenized: real member identity never leaves your environment</text>

