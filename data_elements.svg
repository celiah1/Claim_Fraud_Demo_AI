<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 960" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2251FF"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#051C2C" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1560" height="960" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="44" font-size="12" font-weight="700" fill="#2251FF" letter-spacing="2">TECHNICAL DATA ELEMENTS</text>
  <text x="40" y="84" font-family="Georgia, serif" font-size="30" fill="#051C2C">10 raw fields become 10 features, which feed one structured Claude request and response</text>
  <line x1="40" y1="106" x2="1520" y2="106" stroke="#051C2C" stroke-width="2"/>

  <!-- Column cards -->
  <g filter="url(#sh)">
    <rect x="40"   y="130" width="460" height="600" rx="12" fill="#ffffff"/>
    <rect x="550"  y="130" width="460" height="600" rx="12" fill="#ffffff"/>
    <rect x="1060" y="130" width="460" height="600" rx="12" fill="#ffffff"/>
  </g>
  <!-- headers (dark → white text) -->
  <path d="M40,142 a12,12 0 0 1 12,-12 h436 a12,12 0 0 1 12,12 v44 h-460 z" fill="#0369A1"/>
  <path d="M550,142 a12,12 0 0 1 12,-12 h436 a12,12 0 0 1 12,12 v44 h-460 z" fill="#B45309"/>
  <path d="M1060,142 a12,12 0 0 1 12,-12 h436 a12,12 0 0 1 12,12 v44 h-460 z" fill="#2251FF"/>
  <g font-size="16" font-weight="700" fill="#ffffff">
    <text x="62" y="164">① Raw claim fields</text>
    <text x="572" y="164">② Engineered features</text>
    <text x="1082" y="164">③ Claude input / output</text>
  </g>
  <g font-size="12" fill="#ffffff" text-anchor="end">
    <text x="482" y="164">source: claims file</text>
    <text x="992" y="164">built in Python</text>
    <text x="1502" y="164">JSON schema</text>
  </g>

  <!-- flow arrows between columns -->
  <g stroke="#2251FF" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M504,430 L546,430"/><path d="M1014,430 L1056,430"/>
  </g>

  <!-- sub-header row labels -->
  <g font-size="11" font-weight="700" fill="#5A6872" letter-spacing="1">
    <text x="62" y="212">FIELD</text><text x="250" y="212">TYPE</text><text x="340" y="212">EXAMPLE</text>
    <text x="572" y="212">FEATURE</text><text x="772" y="212">LOGIC</text><text x="930" y="212">VALUE</text>
  </g>

  <!-- ===== Column 1 rows ===== -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="13">
