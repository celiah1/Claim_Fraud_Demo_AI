    <path d="M272,832 L316,832"/><path d="M522,832 L566,832"/><path d="M772,832 L816,832"/><path d="M1022,832 L1066,832"/><path d="M1272,832 L1316,832"/>
  </g>

  <!-- footer -->
  <line x1="40" y1="900" x2="1520" y2="900" stroke="#C9D3DD"/>
  <text x="40" y="922" font-size="11.5" fill="#5A6872">Illustrative synthetic values, consistent with the worked example (PRV-1042, 4 Mar 2026). Field names are proposed for the MVP and can be mapped to your claims system (e.g. 837 / UB-04 fields) in phase 2.</text>
</svg>
