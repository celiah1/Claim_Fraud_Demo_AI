  <rect x="1082" y="224" width="416" height="196" rx="8" fill="#0B2A40"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#E6ECF2">
    <text x="1096" y="246">{ "provider_id": "PRV-1042",</text>
    <text x="1096" y="266">  "specialty": "Family Med",</text>
    <text x="1096" y="286">  "date": "2026-03-04",</text>
    <text x="1096" y="306">  "reason_codes": ["IMPOSSIBLE_DAY"],</text>
    <text x="1096" y="326">  "prov_day_min": 1360,</text>
    <text x="1096" y="346">  "peer_median_min": 480,</text>
    <text x="1096" y="366">  "days_flagged_90d": 6,</text>
    <text x="1096" y="386">  "claims": [ <tspan fill="#9FB3C8">…38 lines…</tspan> ],</text>
    <text x="1096" y="406">  "risk_score": 92 }</text>
  </g>

  <text x="1082" y="450" font-size="11" font-weight="700" fill="#5A6872" letter-spacing="1">RESPONSE · ENFORCED SCHEMA</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13">
