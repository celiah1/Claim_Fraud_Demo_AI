      <text x="1082" y="608">innocent_reasons[]</text><text x="1082" y="640">exposure_usd</text><text x="1082" y="672">action</text>
    </g>
    <g fill="#333F48">
      <text x="1330" y="480">impossible_day</text><text x="1330" y="512">high</text><text x="1330" y="544">0.85</text><text x="1330" y="576">5 steps + IDs</text>
      <text x="1330" y="608">clinic ID?</text><text x="1330" y="640">14200</text><text x="1330" y="672">route_SIU</text>
    </g>
  </g>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="1252" y="466" width="64" height="20" rx="10" fill="#E8EDFF"/><text x="1284" y="480" fill="#2251FF">enum</text>
    <rect x="1252" y="498" width="64" height="20" rx="10" fill="#E8EDFF"/><text x="1284" y="512" fill="#2251FF">enum</text>
    <rect x="1252" y="530" width="64" height="20" rx="10" fill="#E8EDFF"/><text x="1284" y="544" fill="#2251FF">0–1</text>
    <rect x="1252" y="562" width="64" height="20" rx="10" fill="#E8EDFF"/><text x="1284" y="576" fill="#2251FF">list</text>
    <rect x="1252" y="594" width="64" height="20" rx="10" fill="#E8EDFF"/><text x="1284" y="608" fill="#2251FF">list</text>
    <rect x="1252" y="626" width="64" height="20" rx="10" fill="#E8EDFF"/><text x="1284" y="640" fill="#2251FF">decimal</text>
    <rect x="1252" y="658" width="64" height="20" rx="10" fill="#E8EDFF"/><text x="1284" y="672" fill="#2251FF">enum</text>
  </g>
  <text x="1082" y="710" font-size="12" fill="#5A6872">Each finding must cite claim_ids; code verifies they exist</text>

  <!-- ===== Tech stack strip ===== -->
  <text x="40" y="776" font-size="13" font-weight="700" fill="#051C2C" letter-spacing="1.5">TECHNICAL STACK</text>
  <rect x="40" y="792" width="1480" height="80" rx="40" fill="#EEF3FF"/>
  <g font-size="14" font-weight="700" text-anchor="middle">
