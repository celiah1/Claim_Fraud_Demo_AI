    <g fill="#051C2C" font-weight="700">
      <text x="62" y="242">claim_id</text><text x="62" y="288">member_id</text><text x="62" y="334">provider_id</text><text x="62" y="380">specialty</text><text x="62" y="426">service_date</text>
      <text x="62" y="472">cpt_code</text><text x="62" y="518">icd10_code</text><text x="62" y="564">units</text><text x="62" y="610">billed_amt</text><text x="62" y="656">place_of_svc</text>
    </g>
    <g fill="#333F48">
      <text x="340" y="242">CLM-2207</text><text x="340" y="288">MBR-7720</text><text x="340" y="334">PRV-1042</text><text x="340" y="380">Family Med</text><text x="340" y="426">2026-03-04</text>
      <text x="340" y="472">99215</text><text x="340" y="518">E11.9</text><text x="340" y="564">1</text><text x="340" y="610">210.00</text><text x="340" y="656">11 (office)</text>
    </g>
  </g>
  <!-- type badges -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="246" y="228" width="64" height="20" rx="10" fill="#E0F2FE"/><text x="278" y="242" fill="#0369A1">string</text>
    <rect x="246" y="274" width="64" height="20" rx="10" fill="#E0F2FE"/><text x="278" y="288" fill="#0369A1">token</text>
    <rect x="246" y="320" width="64" height="20" rx="10" fill="#E0F2FE"/><text x="278" y="334" fill="#0369A1">string</text>
    <rect x="246" y="366" width="64" height="20" rx="10" fill="#E0F2FE"/><text x="278" y="380" fill="#0369A1">string</text>
    <rect x="246" y="412" width="64" height="20" rx="10" fill="#E0F2FE"/><text x="278" y="426" fill="#0369A1">date</text>
    <rect x="246" y="458" width="64" height="20" rx="10" fill="#E0F2FE"/><text x="278" y="472" fill="#0369A1">string</text>
    <rect x="246" y="504" width="64" height="20" rx="10" fill="#E0F2FE"/><text x="278" y="518" fill="#0369A1">string</text>
