  <g font-family="Consolas, 'Courier New', monospace" font-size="13">
    <g fill="#051C2C" font-weight="700">
      <text x="572" y="242">dup_key</text><text x="572" y="288">dup_gap_days</text><text x="572" y="334">amt_diff_pct</text><text x="572" y="380">std_minutes</text><text x="572" y="426">prov_day_min</text>
      <text x="572" y="472">peer_median_min</text><text x="572" y="518">peer_ratio</text><text x="572" y="564">days_flagged_90d</text><text x="572" y="610">reason_codes</text><text x="572" y="656">risk_score</text>
    </g>
  </g>
  <g font-size="12.5" fill="#5A6872">
    <text x="772" y="242">mbr+prov+cpt hash</text><text x="772" y="288">Δ vs. match</text><text x="772" y="334">|Δ amt| / amt</text><text x="772" y="380">CPT lookup</text><text x="772" y="426">Σ min/prov/day</text>
    <text x="772" y="472">same specialty</text><text x="772" y="518">prov ÷ peer</text><text x="772" y="564">repeat pattern</text><text x="772" y="610">rule hits</text><text x="772" y="656">base + magnitude</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#051C2C" text-anchor="end">
    <text x="990" y="242">a91f…</text><text x="990" y="288">1</text><text x="990" y="334">0.00</text><text x="990" y="380">40</text><text x="990" y="426" fill="#B45309" font-weight="700">1,360</text>
    <text x="990" y="472">480</text><text x="990" y="518" fill="#B45309" font-weight="700">2.8×</text><text x="990" y="564">6</text><text x="990" y="610">[IMPOSSIBLE]</text><text x="990" y="656" fill="#E5484D" font-weight="700">92</text>
  </g>
  <g stroke="#EEF1F4"><line x1="566" y1="257" x2="994" y2="257"/><line x1="566" y1="303" x2="994" y2="303"/><line x1="566" y1="349" x2="994" y2="349"/><line x1="566" y1="395" x2="994" y2="395"/><line x1="566" y1="441" x2="994" y2="441"/><line x1="566" y1="487" x2="994" y2="487"/><line x1="566" y1="533" x2="994" y2="533"/><line x1="566" y1="579" x2="994" y2="579"/><line x1="566" y1="625" x2="994" y2="625"/></g>
  <g font-size="11" font-weight="700">
    <rect x="572" y="684" width="120" height="22" rx="11" fill="#FDECEC"/><text x="632" y="699" text-anchor="middle" fill="#B42318">Rule 1 inputs</text>
    <rect x="702" y="684" width="120" height="22" rx="11" fill="#FFF4DB"/><text x="762" y="699" text-anchor="middle" fill="#8A5A00">Rule 2 inputs</text>
    <text x="834" y="699" fill="#5A6872" font-weight="400" font-size="12">first 3 = Rule 1 · next 5 = Rule 2</text>
  </g>

  <!-- ===== Column 3: Claude I/O ===== -->
