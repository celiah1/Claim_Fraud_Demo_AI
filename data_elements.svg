    <rect x="320"  y="812" width="200" height="40" rx="20" fill="#475569"/><text x="420"  y="837" fill="#ffffff">Python · pandas</text>
    <rect x="570"  y="812" width="200" height="40" rx="20" fill="#B45309"/><text x="670"  y="837" fill="#ffffff">Rules + scoring</text>
    <rect x="820"  y="812" width="200" height="40" rx="20" fill="#2251FF"/><text x="920"  y="837" fill="#ffffff">Claude Batch API</text>
    <rect x="1070" y="812" width="200" height="40" rx="20" fill="#051C2C"/><text x="1170" y="837" fill="#ffffff">Pydantic validation</text>
    <rect x="1320" y="812" width="180" height="40" rx="20" fill="#15803D"/><text x="1410" y="837" fill="#ffffff">Streamlit app</text>
  </g>
