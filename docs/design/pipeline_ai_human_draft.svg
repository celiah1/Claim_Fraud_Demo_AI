<svg xmlns="http://www.w3.org/2000/svg" class="arch" viewBox="0 0 1230 600" role="img" aria-label="Where AI supports investigators, and where human judgment is required, across the four ClaimGuard stages" style="font-family:Inter,'Segoe UI',system-ui,sans-serif;background:#fff">
 <defs>
  <filter id="cgSh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f2d52" flood-opacity=".08"/></filter>
  <marker id="cgArn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#0f2d52" stroke-width="1.6"/></marker>
  <g id="cgPerson"><circle cx="0" cy="-3.5" r="3.4" fill="currentColor"/><path d="M-6.5,7 C-6.5,0.5 6.5,0.5 6.5,7 Z" fill="currentColor"/></g>
  <g id="cgGear"><circle r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><g stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M0,-7.5V-6"/><path d="M0,6V7.5"/><path d="M-7.5,0H-6"/><path d="M6,0H7.5"/><path d="M-5.3,-5.3L-4.3,-4.3"/><path d="M4.3,4.3L5.3,5.3"/><path d="M-5.3,5.3L-4.3,4.3"/><path d="M4.3,-4.3L5.3,-5.3"/></g></g>
  <path id="cgSpark" d="M0,-8 C1,-2 2,-1 8,0 C2,1 1,2 0,8 C-1,2 -2,1 -8,0 C-2,-1 -1,-2 0,-8Z"/>
 </defs>

 <!-- title -->
 <text x="0" y="16" font-size="12" font-weight="600" letter-spacing="1.6" fill="#3b7cc4">HOW CLAIMGUARD WORKS</text>
 <text x="0" y="46" font-size="23" font-weight="700" fill="#0f2d52" letter-spacing="-0.3">Where AI supports investigators, and where human judgment is required</text>
 <text x="0" y="68" font-size="14" fill="#64748b">Rules flag the claims, AI speeds up reading and writing, and people make every decision.</text>

 <!-- stage header -->
 <g font-size="12.5">
  <rect x="190" y="96" width="240" height="4" rx="2" fill="#3b7cc4"/>
  <rect x="450" y="96" width="240" height="4" rx="2" fill="#3b7cc4"/>
  <rect x="710" y="96" width="240" height="4" rx="2" fill="#3b7cc4"/>
  <rect x="970" y="96" width="240" height="4" rx="2" fill="#3b7cc4"/>
  <g fill="#0f2d52"><circle cx="203" cy="130" r="13"/><circle cx="463" cy="130" r="13"/><circle cx="723" cy="130" r="13"/><circle cx="983" cy="130" r="13"/></g>
  <g fill="#fff" font-size="13.5" font-weight="700" text-anchor="middle"><text x="203" y="134.5">1</text><text x="463" y="134.5">2</text><text x="723" y="134.5">3</text><text x="983" y="134.5">4</text></g>
  <g font-size="16" font-weight="700" fill="#0f2d52"><text x="226" y="129">Bring in claims</text><text x="486" y="129">Find unusual claims</text><text x="746" y="129">Review cases</text><text x="1006" y="129">Report</text></g>
  <g fill="#64748b"><text x="226" y="146">Claim Intake · Data Upload</text><text x="486" y="146">Flag Overview · Provider Risk</text><text x="746" y="146">Investigator Queue · Outcomes</text><text x="1006" y="146">Dashboard · Model · Data</text></g>
 </g>

 <!-- row labels -->
 <g>
  <circle cx="16" cy="208" r="14" fill="#ccfbf1"/><use href="#cgSpark" transform="translate(16,208) scale(.8)" fill="#0f766e"/>
  <text x="38" y="205" font-size="14.5" font-weight="700" fill="#0f766e">AI assists</text><text x="38" y="222" font-size="12.5" fill="#64748b">reads, drafts, answers</text>

  <circle cx="16" cy="323" r="14" fill="#dbeafe"/><use href="#cgGear" transform="translate(16,323)" color="#2b5f94"/>
  <text x="38" y="320" font-size="14.5" font-weight="700" fill="#2b5f94">Automated</text><text x="38" y="337" font-size="12.5" fill="#64748b">explainable rules</text>

  <circle cx="16" cy="438" r="14" fill="#0f2d52"/><use href="#cgPerson" transform="translate(16,438)" color="#fff"/>
  <text x="38" y="435" font-size="14.5" font-weight="700" fill="#0f2d52">People decide</text><text x="38" y="452" font-size="12.5" fill="#64748b">final authority</text>
 </g>
 <line x1="0" y1="275" x2="1210" y2="275" stroke="#eef2f7"/><line x1="0" y1="390" x2="1210" y2="390" stroke="#eef2f7"/>

 <!-- AI row -->
 <g font-size="13" fill="#475569">
  <g filter="url(#cgSh)"><rect x="190" y="165" width="240" height="96" rx="12" fill="#f0fdfa" stroke="#99e2d6"/></g>
  <use href="#cgSpark" transform="translate(208,188) scale(.75)" fill="#0f766e"/>
  <text x="222" y="193" font-size="13.5" font-weight="700" fill="#0f766e">Document extraction</text>
  <rect x="370" y="178" width="50" height="19" rx="9.5" fill="#fff" stroke="#99e2d6"/><text x="395" y="191.5" font-size="11.5" text-anchor="middle" fill="#0f766e">Planned</text>
  <text x="206" y="219">Reads messy PDFs and emails</text><text x="206" y="237">into structured claim fields</text>

  <g filter="url(#cgSh)"><rect x="710" y="165" width="240" height="96" rx="12" fill="#f0fdfa" stroke="#99e2d6"/></g>
  <use href="#cgSpark" transform="translate(728,188) scale(.75)" fill="#0f766e"/>
  <text x="742" y="193" font-size="14.5" font-weight="700" fill="#0f766e">Case brief</text>
  <text x="726" y="219">Summarises evidence and next</text><text x="726" y="237">steps; answers case questions</text>

  <g filter="url(#cgSh)"><rect x="970" y="165" width="240" height="96" rx="12" fill="#f0fdfa" stroke="#99e2d6"/></g>
  <use href="#cgSpark" transform="translate(988,188) scale(.75)" fill="#0f766e"/>
  <text x="1002" y="193" font-size="14.5" font-weight="700" fill="#0f766e">Ask your data</text>
  <rect x="1136" y="178" width="62" height="19" rx="9.5" fill="#fff" stroke="#99e2d6"/><text x="1167" y="191.5" font-size="11.5" text-anchor="middle" fill="#0f766e">Read-only</text>
  <text x="986" y="219">Plain-English answers about</text><text x="986" y="237">claims, flags and outcomes</text>
 </g>

 <!-- Automated row -->
 <g font-size="13" fill="#475569">
  <g filter="url(#cgSh)">
   <rect x="190" y="280" width="240" height="96" rx="12" fill="#fff" stroke="#dbe4ef"/>
   <rect x="450" y="280" width="240" height="96" rx="12" fill="#fff" stroke="#dbe4ef"/>
   <rect x="710" y="280" width="240" height="96" rx="12" fill="#fff" stroke="#dbe4ef"/>
   <rect x="970" y="280" width="240" height="96" rx="12" fill="#fff" stroke="#dbe4ef"/>
  </g>
  <g font-size="14.5" font-weight="700" fill="#0f2d52"><text x="206" y="308">Ingest and standardise</text><text x="466" y="308">Screen and prioritise</text><text x="726" y="308">Prepare each case</text><text x="986" y="308">Track and record</text></g>
  <text x="206" y="334">PDF, email, CSV and XLSX</text><text x="206" y="352">mapped to a 12-field contract</text>
  <text x="466" y="334">4 rules give a score + reason;</text><text x="466" y="352">related lines grouped, routed</text>
  <text x="726" y="334">Assigned queue, evidence</text><text x="726" y="352">and a checklist per case</text>
  <text x="986" y="334">Dashboard, exports and a</text><text x="986" y="352">full audit trail</text>
  <g fill="none" stroke="#3b7cc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M436,321 L442,328 L436,335"/><path d="M696,321 L702,328 L696,335"/><path d="M956,321 L962,328 L956,335"/></g>
 </g>

 <!-- Human row -->
 <g font-size="13" fill="#cfe2f7">
  <g filter="url(#cgSh)">
   <rect x="190" y="395" width="240" height="96" rx="12" fill="#0f2d52"/>
   <rect x="710" y="395" width="240" height="96" rx="12" fill="#0f2d52"/>
   <rect x="970" y="395" width="240" height="96" rx="12" fill="#0f2d52"/>
  </g>
  <use href="#cgPerson" transform="translate(209,418)" color="#9cc3ea"/><text x="224" y="423" font-size="14.5" font-weight="700" fill="#fff">Resolve exceptions</text>
  <text x="206" y="449">Confirm rows marked Check</text><text x="206" y="467">or Fix before screening</text>


  <use href="#cgPerson" transform="translate(729,418)" color="#9cc3ea"/><text x="744" y="423" font-size="14.5" font-weight="700" fill="#fff">Decide the outcome</text>
  <text x="726" y="449">Reason and evidence required;</text><text x="726" y="467">sign-off above $5K</text>

  <use href="#cgPerson" transform="translate(989,418)" color="#9cc3ea"/><text x="1004" y="423" font-size="14.5" font-weight="700" fill="#fff">Approve changes</text>
  <text x="986" y="449">Rule and model updates need</text><text x="986" y="467">sign-off before go-live</text>
 </g>

 <!-- feedback loop -->
 <path d="M1090,491 V526 Q1090,534 1082,534 H578 Q570,534 570,526 V382" fill="none" stroke="#0f2d52" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cgArn)"/>
 <rect x="700" y="524" width="252" height="20" rx="10" fill="#fff"/>
 <text x="826" y="538" font-size="12.5" font-weight="600" fill="#0f2d52" text-anchor="middle">Validated outcomes refine the rules ↺</text>
 <text x="582" y="445" font-size="12.5" fill="#64748b">No manual step:</text><text x="582" y="462" font-size="12.5" fill="#64748b">flags are automatic</text>

 <!-- footer -->
 <line x1="0" y1="562" x2="1210" y2="562" stroke="#e2e8f0"/>
 <text x="0" y="584" font-size="12" fill="#64748b"><tspan font-weight="700" fill="#334155">Note</tspan>  AI is optional and off in the pilot; every AI step has a rule-based fallback. AI never flags a claim or records an outcome. Synthetic demo data.</text>
</svg>
