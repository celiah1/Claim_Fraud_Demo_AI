<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2251FF"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#051C2C" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="1450" height="800" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="44" font-size="12" font-weight="700" fill="#2251FF" letter-spacing="2">AI REASONING LAYER</text>
  <text x="40" y="84" font-family="Georgia, serif" font-size="30" fill="#051C2C">From fraud flag to investigator-ready brief in 6 steps</text>
  <line x1="40" y1="108" x2="1410" y2="108" stroke="#051C2C" stroke-width="2"/>

  <!-- Flow line -->
  <line x1="150" y1="240" x2="1300" y2="240" stroke="#D6E0F5" stroke-width="6"/>
  <g stroke="#2251FF" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M212,240 L314,240"/><path d="M442,240 L544,240"/><path d="M672,240 L774,240"/>
    <path d="M902,240 L1004,240"/><path d="M1132,240 L1234,240"/>
  </g>

  <!-- ===== Step circles ===== -->
  <!-- 1 Flag -->
  <g filter="url(#sh)"><circle cx="150" cy="240" r="58" fill="#EEF3FF" stroke="#051C2C" stroke-width="2"/></g>
  <line x1="132" y1="210" x2="132" y2="272" stroke="#051C2C" stroke-width="4" stroke-linecap="round"/>
  <path d="M134,212 L174,224 L134,238 z" fill="#E5484D"/>
  <!-- 2 Evidence stack -->
  <g filter="url(#sh)"><circle cx="380" cy="240" r="58" fill="#EEF3FF" stroke="#051C2C" stroke-width="2"/></g>
  <rect x="352" y="208" width="56" height="16" rx="3" fill="#051C2C"/>
  <rect x="352" y="232" width="56" height="16" rx="3" fill="#2251FF"/>
  <rect x="352" y="256" width="56" height="16" rx="3" fill="#00A9F4"/>
  <!-- 3 Prompt document -->
  <g filter="url(#sh)"><circle cx="610" cy="240" r="58" fill="#EEF3FF" stroke="#051C2C" stroke-width="2"/></g>
  <path d="M586,204 h36 l14,14 v58 h-50 z" fill="#ffffff" stroke="#051C2C" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#2251FF" stroke-width="3" stroke-linecap="round"><line x1="596" y1="230" x2="626" y2="230"/><line x1="596" y1="244" x2="626" y2="244"/><line x1="596" y1="258" x2="616" y2="258"/></g>
  <!-- 4 Claude (highlight) -->
  <g filter="url(#sh)"><circle cx="840" cy="240" r="70" fill="#2251FF"/></g>
  <path d="M840,196 C846,226 854,234 884,240 C854,246 846,254 840,284 C834,254 826,246 796,240 C826,234 834,226 840,196 z" fill="#ffffff"/>
  <circle cx="872" cy="208" r="6" fill="#BFD0FF"/>
  <!-- 5 Shield -->
  <g filter="url(#sh)"><circle cx="1070" cy="240" r="58" fill="#EEF3FF" stroke="#051C2C" stroke-width="2"/></g>
  <path d="M1070,204 L1100,216 V242 C1100,262 1086,274 1070,280 C1054,274 1040,262 1040,242 V216 z" fill="#051C2C"/>
  <path d="M1056,241 L1066,252 L1086,230" stroke="#4ADE80" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 6 Investigator -->
  <g filter="url(#sh)"><circle cx="1300" cy="240" r="58" fill="#EEF3FF" stroke="#051C2C" stroke-width="2"/></g>
  <circle cx="1300" cy="222" r="16" fill="#051C2C"/>
  <path d="M1270,276 C1272,252 1286,244 1300,244 C1314,244 1328,252 1330,276 z" fill="#051C2C"/>

  <!-- Step numbers -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="196" cy="190" r="14" fill="#051C2C"/><text x="196" y="195" fill="#ffffff">1</text>
    <circle cx="426" cy="190" r="14" fill="#051C2C"/><text x="426" y="195" fill="#ffffff">2</text>
    <circle cx="656" cy="190" r="14" fill="#051C2C"/><text x="656" y="195" fill="#ffffff">3</text>
    <circle cx="894" cy="180" r="14" fill="#051C2C"/><text x="894" y="185" fill="#ffffff">4</text>
    <circle cx="1116" cy="190" r="14" fill="#051C2C"/><text x="1116" y="195" fill="#ffffff">5</text>
    <circle cx="1346" cy="190" r="14" fill="#051C2C"/><text x="1346" y="195" fill="#ffffff">6</text>
  </g>

  <!-- Labels -->
  <g text-anchor="middle">
    <text x="150" y="340" font-size="17" font-weight="700" fill="#051C2C">Flag</text>
    <text x="150" y="364" font-size="13" fill="#5A6872">Rules flag 1–5%</text>
    <text x="380" y="340" font-size="17" font-weight="700" fill="#051C2C">Gather evidence</text>
    <text x="380" y="364" font-size="13" fill="#5A6872">Claim + history + peers</text>
    <text x="610" y="340" font-size="17" font-weight="700" fill="#051C2C">Build prompt</text>
    <text x="610" y="364" font-size="13" fill="#5A6872">Cached rules + examples</text>
    <text x="840" y="340" font-size="17" font-weight="700" fill="#2251FF">Claude analyzes</text>
    <text x="840" y="364" font-size="13" fill="#5A6872">Opus 5.5 · Batch API</text>
    <text x="1070" y="340" font-size="17" font-weight="700" fill="#051C2C">Verify</text>
    <text x="1070" y="364" font-size="13" fill="#5A6872">Facts checked vs. data</text>
    <text x="1300" y="340" font-size="17" font-weight="700" fill="#051C2C">Human decides</text>
    <text x="1300" y="364" font-size="13" fill="#5A6872">Brief → investigator</text>
  </g>

  <!-- Chips -->
  <g font-size="11.5" font-weight="700" text-anchor="middle">
    <rect x="105" y="380" width="90" height="24" rx="12" fill="#F2F5F8"/><text x="150" y="396" fill="#051C2C">No token cost</text>
    <rect x="325" y="380" width="110" height="24" rx="12" fill="#F2F5F8"/><text x="380" y="396" fill="#051C2C">PHI de-identified</text>
    <rect x="555" y="380" width="110" height="24" rx="12" fill="#F2F5F8"/><text x="610" y="396" fill="#051C2C">Prompt caching</text>
    <rect x="785" y="380" width="110" height="24" rx="12" fill="#2251FF"/><text x="840" y="396" fill="#ffffff">JSON output</text>
    <rect x="1015" y="380" width="110" height="24" rx="12" fill="#F2F5F8"/><text x="1070" y="396" fill="#051C2C">Fail → manual</text>
    <rect x="1240" y="380" width="120" height="24" rx="12" fill="#F2F5F8"/><text x="1300" y="396" fill="#051C2C">Low · Med · High</text>
  </g>

  <!-- Governance strip -->
  <rect x="40" y="446" width="1370" height="76" rx="38" fill="#EEF3FF"/>
  <text x="80" y="490" font-size="13" font-weight="700" fill="#051C2C" letter-spacing="1.5">GOVERNANCE</text>
  <g font-size="14" font-weight="600" fill="#051C2C">
    <circle cx="290" cy="484" r="16" fill="#051C2C"/><path d="M282,484 l6,6 l10,-12" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="316" y="489">Human in the loop</text>
    <circle cx="520" cy="484" r="16" fill="#051C2C"/><rect x="513" y="476" width="14" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <text x="546" y="489">Audit trail</text>
    <circle cx="700" cy="484" r="16" fill="#051C2C"/><circle cx="700" cy="484" r="7" fill="none" stroke="#ffffff" stroke-width="2.5"/><circle cx="700" cy="484" r="2" fill="#ffffff"/>
    <text x="726" y="489">Evaluation set</text>
    <circle cx="900" cy="484" r="16" fill="#051C2C"/><path d="M692,0" /><path d="M893,478 a8,8 0 1 1 -1,10" stroke="#ffffff" stroke-width="2.5" fill="none"/><path d="M889,474 l4,5 l5,-4" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <text x="926" y="489">Feedback loop</text>
    <circle cx="1110" cy="484" r="16" fill="#051C2C"/><path d="M1101,490 l6,-6 l4,4 l8,-9" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="1136" y="489">Cost &amp; quality monitoring</text>
  </g>

  <!-- KPI tiles -->
  <g filter="url(#sh)">
    <rect x="40" y="560" width="440" height="150" rx="14" fill="#ffffff"/>
    <rect x="505" y="560" width="440" height="150" rx="14" fill="#ffffff"/>
    <rect x="970" y="560" width="440" height="150" rx="14" fill="#ffffff"/>
  </g>
  <rect x="40" y="560" width="8" height="150" rx="4" fill="#2251FF"/>
  <rect x="505" y="560" width="8" height="150" rx="4" fill="#2251FF"/>
  <rect x="970" y="560" width="8" height="150" rx="4" fill="#2251FF"/>

  <text x="76" y="640" font-family="Georgia, serif" font-size="54" fill="#2251FF">95%+</text>
  <text x="76" y="680" font-size="15" fill="#051C2C" font-weight="700">claims never reach the LLM</text>

  <text x="541" y="640" font-family="Georgia, serif" font-size="54" fill="#2251FF">100%</text>
  <text x="541" y="680" font-size="15" fill="#051C2C" font-weight="700">of cited facts verified</text>

  <text x="1006" y="640" font-family="Georgia, serif" font-size="54" fill="#2251FF">~1¢</text>
  <text x="1006" y="680" font-size="15" fill="#051C2C" font-weight="700">per flagged claim (batched)</text>

  <!-- Footer -->
  <text x="40" y="760" font-size="11" fill="#5A6872">Note: design targets, not measured results. Cost assumes Claude Opus 5.5 list pricing, ~2K input + ~500 output tokens per brief, Batch API.</text>
</svg>
